<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pisotrack — Sign up</title>
    <link rel="stylesheet" href="./output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body{ font-family:'Inter', sans-serif; }
      .num{ font-family:'IBM Plex Mono', monospace; }

      @keyframes cardIn{
        from{ opacity:0; transform:translateY(18px) scale(.98); }
        to{ opacity:1; transform:translateY(0) scale(1); }
      }
      .card{ animation: cardIn .7s cubic-bezier(.16,.8,.24,1) both; box-shadow: 0 30px 70px -25px rgba(0,0,0,.55); }
      .mark{ animation: cardIn .6s cubic-bezier(.16,.8,.24,1) both; animation-delay:.1s; }
      .chip-in{ animation: cardIn .8s cubic-bezier(.16,.8,.24,1) both; }

      @keyframes drift{
        0%,100%{ transform:translate(0,0) scale(1); }
        50%{ transform:translate(22px,-26px) scale(1.08); }
      }
      @keyframes driftSlow{
        0%,100%{ transform:translate(0,0) rotate(-6deg); }
        50%{ transform:translate(-14px,16px) rotate(-3deg); }
      }
      .glow{ position:absolute; border-radius:9999px; filter:blur(80px); animation: drift 13s ease-in-out infinite; pointer-events:none; }

      .dot-grid{
        background-image: radial-gradient(rgba(246,242,231,0.08) 1px, transparent 1px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 80%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 80%);
      }

      .float-chip{ animation: driftSlow 9s ease-in-out infinite; }

      .field-box{ transition: border-color .2s ease, box-shadow .2s ease; }
      .field-box:focus-within{ border-color:#C99A3E; box-shadow: 0 0 0 3px rgba(201,154,62,0.18); }

      .signup{ transition: background-color .15s ease, transform .15s ease, box-shadow .15s ease; }
      .signup:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(201,154,62,.55); }
      .signup:active{ transform: translateY(0); }

      .toggle, .toggle-confirm{ transition: color .15s ease; }
      .toggle:hover, .toggle-confirm:hover{ color:#C99A3E; }

      @media (prefers-reduced-motion: reduce){
        .card, .glow, .mark, .chip-in, .float-chip{ animation:none !important; }
        .signup:hover{ transform:none; }
      }
    </style>
  </head>
  <body class="bg-[#141C18] h-screen flex justify-center items-center relative overflow-hidden">

    <div class="absolute inset-0 dot-grid"></div>
    <span class="glow w-80 h-80 bg-[#C99A3E]/10" style="top:6%; left:10%;"></span>
    <span class="glow w-96 h-96 bg-[#C99A3E]/[0.06]" style="bottom:4%; right:8%; animation-delay:-6s;"></span>

    <!-- Back button -->
    <a href="./index.html" class="back-in back-link absolute top-6 left-6 z-[3] flex items-center gap-1.5 text-sm text-[#9CA69E]">
      <span aria-hidden="true">←</span> Back
    </a>

    <!-- floating decorative entry chips -->
    <div class="chip-in float-chip hidden md:block absolute bg-[#F6F2E7] border border-[#DDD5C0] rounded-[10px] px-4 py-3 shadow-[0_20px_40px_-20px_rgba(0,0,0,.6)]" style="top:14%; left:8%; animation-delay:.15s;">
      <p class="text-[10px] text-[#6B6656]">Client payment received</p>
      <p class="num text-sm font-medium text-[#9C7A2E]">+ 12,000.00</p>
    </div>
    <div class="chip-in float-chip hidden md:block absolute bg-[#F6F2E7] border border-[#DDD5C0] rounded-[10px] px-4 py-3 shadow-[0_20px_40px_-20px_rgba(0,0,0,.6)]" style="bottom:16%; right:9%; animation-delay:.3s; animation-duration:11s;">
      <p class="text-[10px] text-[#6B6656]">Supplies budget</p>
      <p class="num text-sm font-medium text-[#C1554A]">92% used</p>
    </div>
    <div class="chip-in float-chip hidden lg:block absolute bg-[#F6F2E7] border border-[#DDD5C0] rounded-[10px] px-4 py-3 shadow-[0_20px_40px_-20px_rgba(0,0,0,.6)]" style="top:20%; right:12%; animation-delay:.45s; animation-duration:10s;">
      <p class="text-[10px] text-[#6B6656]">Balance carried forward</p>
      <p class="num text-sm font-medium text-[#2A241C]">₱216,230.00</p>
    </div>

    <main class="relative z-[2]">
      <div class="signup-form-container relative flex flex-col items-center justify-center px-5">

        <div class="mark w-11 h-11 rounded-[10px] bg-[#C99A3E] text-[#2A241C] flex items-center justify-center font-['Inter',sans-serif] font-semibold text-lg mb-6">₱</div>

        <div class="card w-[400px] bg-[#F6F2E7] text-[#2A241C] rounded-[14px] px-[34px] pt-[38px] pb-[30px] relative">
          <p class="subtext text-center text-xs text-[#6B6656]">Business owner sign up</p>
          <h1 class="font-['Fraunces',serif] font-semibold text-[27px] mt-0 mb-1.5 text-center">Create your account</h1>

          <div class="input-container mt-8">

            <div class="field mb-4">
              <label for="business" class="block text-xs text-[#6B6656] mb-1.5">Business name</label>
              <div class="field-box flex items-center border border-[#DDD5C0] rounded-[9px] bg-[#FFFDF7] px-3.5 h-[46px]">
                <input id="business" type="text" placeholder="Your business name" class="border-none outline-none bg-transparent flex-1 text-sm font-['Inter',sans-serif] text-[#2A241C] placeholder:text-[#B1AA95]">
              </div>
            </div>

            <div class="field mb-4">
              <label for="email" class="block text-xs text-[#6B6656] mb-1.5">Email</label>
              <div class="field-box flex items-center border border-[#DDD5C0] rounded-[9px] bg-[#FFFDF7] px-3.5 h-[46px]">
                <input id="email" type="text" placeholder="you@email.com" class="border-none outline-none bg-transparent flex-1 text-sm font-['Inter',sans-serif] text-[#2A241C] placeholder:text-[#B1AA95]">
              </div>
            </div>

            <div class="field mb-4">
              <label for="pass" class="block text-xs text-[#6B6656] mb-1.5">Passcode</label>
              <div class="field-box flex items-center border border-[#DDD5C0] rounded-[9px] bg-[#FFFDF7] px-3.5 h-[46px]">
                <input id="pass" type="password" placeholder="Create a passcode" class="border-none outline-none bg-transparent flex-1 text-sm font-['Inter',sans-serif] text-[#2A241C] placeholder:text-[#B1AA95]">
                <span class="toggle text-xs text-[#9C7A2E] cursor-pointer font-medium">Show</span>
              </div>
            </div>

            <div class="field mb-4">
              <label for="confirmPass" class="block text-xs text-[#6B6656] mb-1.5">Confirm passcode</label>
              <div class="field-box flex items-center border border-[#DDD5C0] rounded-[9px] bg-[#FFFDF7] px-3.5 h-[46px]">
                <input id="confirmPass" type="password" placeholder="Re-enter your passcode" class="border-none outline-none bg-transparent flex-1 text-sm font-['Inter',sans-serif] text-[#2A241C] placeholder:text-[#B1AA95]">
                <span class="toggle-confirm text-xs text-[#9C7A2E] cursor-pointer font-medium">Show</span>
              </div>
            </div>

            <p class="error-msg text-[#e53935] text-[0.85rem] -mt-2 mb-2 min-h-[1em]"></p>

            <button class="signup w-full h-[47px] border-none rounded-[9px] bg-[#c99a3e] text-[#2A241C] text-[14.5px] font-semibold font-['Inter',sans-serif] cursor-pointer">Create account</button>

            <p class="text-center text-xs text-[#6B6656] mt-4">Already have an account? <a href="./login.html" class="text-[#9C7A2E] font-medium">Sign in</a></p>

          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
