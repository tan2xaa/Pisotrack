<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PisoTrack — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#F8FAFC',
          ink2: '#FFFFFF',
          cream: '#0F172A',
          creamsoft: '#0F172A',
          textdark: '#0F172A',
          muted: '#64748B',
          mutedlight: '#94A3B8',
          gold: { DEFAULT: '#C99A3E', deep: '#9C7A2E', soft: '#FEF3C7' },
          border2: '#E2E8F0',
          stamp: { DEFAULT: '#EF4444', light: '#FEE2E2' },
          teal: { DEFAULT: '#0D9488' },
        },
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        },
        borderRadius: { xl2: '12px' }
      }
    }
  }
</script>
<style>
  body{ font-family:'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  h1,h2,h3,.font-serif{ font-family:'Fraunces', serif; }
  .num{ font-family:'IBM Plex Mono', monospace; }
  .badge-dot{ animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
</style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] antialiased">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-56 shrink-0 border-r border-[#E2E8F0] bg-white hidden lg:flex flex-col">
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-[#E2E8F0]">
      <span class="w-8 h-8 rounded-md bg-gold text-white flex items-center justify-center font-mono text-sm font-semibold">₱</span>
      <span class="font-serif font-semibold text-slate-900">PisoTrack</span>
    </div>
    <nav class="flex-1 px-3 py-5 space-y-1 text-sm">
      <a class="flex items-center gap-2.5 px-3 py-2 rounded-md bg-amber-50 text-amber-800 font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-gold"></span> Dashboard
      </a>
    </nav>
  </aside>

  <div class="flex-1 min-w-0 bg-[#F8FAFC]">

    <header class="h-16 border-b border-[#E2E8F0] bg-white flex items-center justify-between px-6">
      <h1 class="text-lg font-semibold text-slate-900 leading-none">Dashboard</h1>
      <button id="add-entry-btn" type="button" class="text-xs font-semibold bg-gold hover:bg-[#B38734] text-white rounded-md px-3.5 py-2 transition-colors">+ Add entry</button>
    </header>

    <div class="p-6 space-y-6">

      <div class="grid sm:grid-cols-3 gap-4">
        <!-- Owner-only: full balance view (hidden until role is confirmed as owner) -->
        <div id="balance-card" data-owner-only class="hidden border border-[#E2E8F0] rounded-xl2 p-5 bg-white shadow-xs">
          <p class="text-xs text-slate-500">Total balance</p>
          <p id="total-balance" class="num text-2xl font-medium mt-1 text-slate-900">₱0</p>
        </div>
        <!-- Shared: both roles can see income/expense totals -->
        <div class="border border-[#E2E8F0] rounded-xl2 p-5 bg-white shadow-xs">
          <p class="text-xs text-slate-500">Income this month</p>
          <p id="total-income" class="num text-2xl font-medium mt-1 text-slate-900">₱0</p>
        </div>
        <div class="border border-[#E2E8F0] rounded-xl2 p-5 bg-white shadow-xs">
          <p class="text-xs text-slate-500">Expenses this month</p>
          <p id="total-expenses" class="num text-2xl font-medium mt-1 text-slate-900">₱0</p>
        </div>
      </div>

      <!-- Owner-only: full expense breakdown by category (hidden until role is confirmed as owner) -->
      <div id="category-chart-card" data-owner-only class="hidden border border-[#E2E8F0] rounded-xl2 p-5 bg-white shadow-xs max-w-xl">
        <p class="text-sm font-medium text-slate-900">Expenses by category</p>
        <p class="text-xs text-slate-500">Where this month's spending went</p>

        <div class="mt-5 relative w-48 h-48 mx-auto">
          <canvas id="expenseChart"></canvas>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-1">
            <span class="num text-lg font-medium text-slate-900">₱31,940</span>
            <span class="text-[10px] text-slate-500">Total</span>
          </div>
        </div>

        <ul class="mt-5 space-y-3 text-sm">
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2 text-slate-600"><span class="w-2 h-2 rounded-full bg-gold inline-block"></span> Payroll</span>
            <span class="num text-slate-900">₱15,330 <span class="text-slate-400">48%</span></span>
          </li>
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2 text-slate-600"><span class="w-2 h-2 rounded-full bg-stamp inline-block"></span> Supplies</span>
            <span class="num text-slate-900">₱8,940 <span class="text-slate-400">28%</span></span>
          </li>
          <li class="flex items-center justify-between">
            <span class="flex items-center gap-2 text-slate-600"><span class="w-2 h-2 rounded-full bg-teal inline-block"></span> Utilities</span>
            <span class="num text-slate-900">₱7,670 <span class="text-slate-400">24%</span></span>
          </li>
        </ul>
      </div>

    </div>
  </div>
</div>

<!-- ENTRY FORM MODAL (both roles) -->
<div id="entry-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/50 p-4" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
  <div class="w-full max-w-md bg-white rounded-xl2 border border-[#E2E8F0] shadow-lg p-6">
    <div class="flex items-center justify-between">
      <h2 id="entry-modal-title" class="text-lg font-semibold text-slate-900">Add entry</h2>
      <button id="entry-close" type="button" class="text-slate-400 hover:text-slate-600 text-xl leading-none" aria-label="Close">&times;</button>
    </div>

    <form id="entry-form" class="mt-4 space-y-4" novalidate>
      <div>
        <label for="entry-type" class="block text-xs text-slate-500 mb-1">Type</label>
        <select id="entry-type" class="w-full border border-[#E2E8F0] rounded-md px-3 py-2 text-sm bg-white">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="entry-amount" class="block text-xs text-slate-500 mb-1">Amount (₱)</label>
          <input id="entry-amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" class="num w-full border border-[#E2E8F0] rounded-md px-3 py-2 text-sm">
        </div>
        <div>
          <label for="entry-date" class="block text-xs text-slate-500 mb-1">Date</label>
          <input id="entry-date" type="date" class="w-full border border-[#E2E8F0] rounded-md px-3 py-2 text-sm">
        </div>
      </div>

      <div>
        <label for="entry-category" class="block text-xs text-slate-500 mb-1">Category</label>
        <select id="entry-category" class="w-full border border-[#E2E8F0] rounded-md px-3 py-2 text-sm bg-white"></select>
        <div id="new-category-row" class="hidden mt-2 gap-2">
          <input id="new-category-input" type="text" maxlength="40" placeholder="New category name" class="flex-1 border border-[#E2E8F0] rounded-md px-3 py-2 text-sm">
          <button id="add-category-btn" type="button" class="text-xs font-semibold bg-gold hover:bg-[#B38734] text-white rounded-md px-3.5 py-2 disabled:opacity-60">Add</button>
        </div>
        <p id="category-error" class="hidden mt-1 text-xs text-red-600"></p>
      </div>

      <div>
        <label for="entry-description" class="block text-xs text-slate-500 mb-1">Description (optional)</label>
        <input id="entry-description" type="text" maxlength="120" class="w-full border border-[#E2E8F0] rounded-md px-3 py-2 text-sm">
      </div>

      <p id="entry-error" class="hidden text-xs text-red-600"></p>

      <div class="flex justify-end gap-2 pt-1">
        <button id="entry-cancel" type="button" class="text-xs font-semibold border border-[#E2E8F0] text-slate-600 hover:bg-slate-50 rounded-md px-3.5 py-2">Cancel</button>
        <button id="entry-submit" type="submit" class="text-xs font-semibold bg-gold hover:bg-[#B38734] text-white rounded-md px-3.5 py-2 disabled:opacity-60">Save entry</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="./scripts/dashboard.js"></script>
</body>
</html>
